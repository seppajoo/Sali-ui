<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sali">
  <title>Salipäiväkirja</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="weight-input.css">
</head>
<body>
  <main>
    <section id="view-log" class="view active">
      <header class="vh">
        <h1>Kirjaa</h1>
        <label class="pill date-pill">
          <span id="date-label">Tänään</span>
          <svg viewBox="0 0 24 24" class="ico-s"><path d="M6 9l6 6 6-6"/></svg>
          <input type="date" id="f-date" required aria-label="Päivä">
        </label>
      </header>

      <form id="log-form" autocomplete="off">
        <input type="text" id="f-exercise" class="ex-input" list="exercise-options" placeholder="Liike" required aria-label="Liike" enterkeyhint="next">
        <datalist id="exercise-options"></datalist>
        <div id="recent-chips" class="chips"></div>

        <div class="steppers">
          <div class="stp">
            <div class="stp-cap">Paino</div>
            <div class="stp-row">
              <button type="button" data-step="weight" data-delta="-2.5" aria-label="Vähennä painoa">−</button>
              <input type="number" id="f-weight" inputmode="decimal" step="0.25" min="0" required placeholder="0" aria-label="Paino kiloina">
              <button type="button" data-step="weight" data-delta="2.5" aria-label="Lisää painoa">+</button>
            </div>
            <div class="stp-unit">kg</div>
          </div>
          <div class="stp">
            <div class="stp-cap">Toistot</div>
            <div class="stp-row">
              <button type="button" data-step="reps" data-delta="-1" aria-label="Vähennä toistoja">−</button>
              <input type="number" id="f-reps" inputmode="numeric" step="1" min="1" required placeholder="0" aria-label="Toistojen määrä">
              <button type="button" data-step="reps" data-delta="1" aria-label="Lisää toistoja">+</button>
            </div>
            <div class="stp-unit">toistoa</div>
          </div>
        </div>
        <button type="submit" class="cta">Lisää sarja</button>
      </form>

      <div id="last-time" class="hidden"></div>
      <div id="today-list"></div>
    </section>

    <section id="view-progress" class="view"><div id="progress-body"></div></section>
    <section id="view-activity" class="view"><div id="activity-body"></div></section>
    <section id="view-history" class="view"><div id="history-body"></div></section>
  </main>

  <nav class="tabs">
    <button data-view="log" class="on">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Kirjaa</button>
    <button data-view="progress">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Kehitys</button>
    <button data-view="activity">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Aktiivisuus</button>
    <button data-view="history">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Historia</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="file-import" accept=".json,.csv" hidden>

  <script type="module" src="app.js"></script>
  <script type="module" src="enhancements.js"></script>
</body>
</html>
